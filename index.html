<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日打卡 · 日省吾身</title>
  <meta name="description" content="每日打卡工具 — 中国风设计，含农历、节气、节日、德国假期、打卡管理">

  <!-- 字体：Google Fonts 思源宋体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- 样式 -->
  <link rel="stylesheet" href="style.css?v=20260818c">

  <!-- 配置（最先加载，其他模块依赖） -->
  <script src="config.js?v=20260818c"></script>
</head>
<body>

  <div class="container">

    <!-- 头部 - 应用标题 -->
    <div class="header">
      <div class="app-title">每日打卡</div>
      <div class="app-subtitle">日 省 吾 身</div>
    </div>

    <!-- 日期导航 -->
    <div id="date-nav" class="date-nav"></div>

    <!-- 日期卡片（阳历/农历/节气/节日/假期） -->
    <div id="header"></div>

    <!-- 进度条 -->
    <div id="progress-section" class="progress-section"></div>

    <!-- 打卡分类区 -->
    <div class="checklist-section">
      <div class="section-title" id="section-title">
        <span>今日功课</span>
        <button id="manage-btn" class="section-btn" title="管理分组">⚙️</button>
      </div>
      <div id="checklist" class="checklist"></div>
    </div>

    <!-- 操作按钮 -->
    <div class="actions">
      <button id="save-defaults-btn" class="action-btn primary">📌 存为默认</button>
      <button id="reset-btn" class="action-btn danger">🔄 重置今日</button>
      <button id="export-btn" class="action-btn">📤 导出数据</button>
      <button id="import-btn" class="action-btn">📥 导入数据</button>
    </div>

    <!-- 统计 -->
    <div id="stats-section" class="stats-section"></div>

    <!-- 页脚 -->
    <div class="footer"></div>
  </div>

  <!-- 确认弹窗 -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title" id="modal-title">确认</div>
      <div class="modal-text" id="modal-text">确定要执行此操作吗？</div>
      <div class="modal-btns">
        <button id="modal-confirm" class="modal-btn confirm">确定</button>
        <button id="modal-cancel" class="modal-btn cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- Scripts（按依赖顺序加载） -->
  <script src="lunar-javascript.js?v=20260818c"></script>
  <script src="data.js?v=20260818c"></script>
  <script src="app.js?v=20260818c"></script>
  <script src="render.js?v=20260818c"></script>

</body>
</html>
