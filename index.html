<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日打卡 · 日省吾身</title>
  <meta name="description" content="每日打卡工具 — 中国风设计，含农历、节气、节日、德国假期、打卡管理">

  <!-- PWA：可安装为 App -->
  <meta name="theme-color" content="#8B2500">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <!-- 字体：Google Fonts 思源宋体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- 样式 -->
  <link rel="stylesheet" href="style.css?v=20260916d">

  <!-- 配置（最先加载，其他模块依赖） -->
  <script src="config.js?v=20260916d"></script>
  <!-- 语言模块（在 data.js 之前，data.js 调用 getLocale/fmtDateStr） -->
  <script src="i18n.js?v=20260916d"></script>
</head>
<body>

  <div class="container">

    <!-- 头部 - 应用标题 + 语言切换 -->
    <div class="header">
      <div class="header-text">
        <div class="app-title" data-i18n="每日打卡">每日打卡</div>
        <div class="app-subtitle" data-i18n="日省吾身">日 省 吾 身</div>
      </div>
      <button id="lang-btn" class="lang-btn" title="切换语言 / Switch language">EN</button>
    </div>

    <!-- 日期导航 -->
    <div id="date-nav" class="date-nav"></div>

    <!-- 日期卡片（阳历/农历/节气/节日/假期） -->
    <div id="header"></div>

    <!-- 进度条 -->
    <div id="progress-section" class="progress-section"></div>

    <!-- 打卡分类区 -->
    <div class="checklist-section">
      <div class="section-title" id="section-title">
        <span data-i18n="今日功课">今日功课</span>
        <button id="manage-btn" class="section-btn" title="管理分组 / Manage Groups">⚙️</button>
      </div>
      <div id="checklist" class="checklist"></div>
    </div>

    <!-- 操作按钮 -->
    <div class="actions">
      <button id="save-defaults-btn" class="action-btn primary"><span>📌</span> <span data-i18n="存为默认">存为默认</span></button>
      <button id="reset-btn" class="action-btn danger"><span>🔄</span> <span data-i18n="重置今日">重置今日</span></button>
      <button id="stats-btn" class="action-btn"><span>📊</span> <span data-i18n="月统计">月统计</span></button>
      <button id="export-btn" class="action-btn"><span>📤</span> <span data-i18n="导出数据">导出数据</span></button>
      <button id="import-btn" class="action-btn"><span>📥</span> <span data-i18n="导入数据">导入数据</span></button>
    </div>

    <!-- 统计 -->
    <div id="stats-section" class="stats-section"></div>

    <!-- 页脚 -->
    <div class="footer"></div>
  </div>

  <!-- 日期选择器（隐藏，触发时弹出系统日历） -->
  <input type="date" id="date-picker" style="position:fixed;opacity:0;pointer-events:none;z-index:-1;width:1px;height:1px;" aria-hidden="true">

  <!-- 日历弹窗 -->
  <div id="calendar-overlay" class="cal-overlay">
    <div class="cal-box" id="cal-box">
      <div class="cal-header">
        <button class="cal-nav" id="cal-prev">‹</button>
        <span class="cal-title" id="cal-title">2026年 8月</span>
        <button class="cal-nav" id="cal-next">›</button>
      </div>
      <div class="cal-weekdays">
        <span data-i18n="一">一</span><span data-i18n="二">二</span><span data-i18n="三">三</span><span data-i18n="四">四</span><span data-i18n="五">五</span><span data-i18n="六">六</span><span data-i18n="日">日</span>
      </div>
      <div class="cal-days" id="cal-days"></div>
      <div class="cal-footer">
        <button class="cal-btn" id="cal-today" data-i18n="今天">今天</button>
        <button class="cal-btn cal-close" id="cal-close" data-i18n="取消">取消</button>
      </div>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title" id="modal-title" data-i18n="确认">确认</div>
      <div class="modal-text" id="modal-text" data-i18n="确定要执行此操作吗？">确定要执行此操作吗？</div>
      <div class="modal-btns">
        <button id="modal-confirm" class="modal-btn confirm" data-i18n="确定">确定</button>
        <button id="modal-cancel" class="modal-btn cancel" data-i18n="取消">取消</button>
      </div>
    </div>
  </div>

  <!-- Scripts（按依赖顺序加载） -->
  <script src="lunar-javascript.js?v=20260916d"></script>
  <script src="data.js?v=20260916d"></script>
  <script src="app.js?v=20260916d"></script>
  <script src="render.js?v=20260916d"></script>

  <!-- PWA：注册 Service Worker（支持离线 / 安装为 App） -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('Service Worker 注册失败：', err);
        });
      });
    }
  </script>

</body>
</html>
